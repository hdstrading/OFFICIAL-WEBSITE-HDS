# nginx site configuration for hdstradingopc.com on an IONOS VPS / Cloud Server.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hdstradingopc
#   sudo ln -s /etc/nginx/sites-available/hdstradingopc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a free TLS certificate:
#   sudo certbot --nginx -d hdstradingopc.com -d www.hdstradingopc.com
#
# Certbot rewrites the listen directives below to add TLS. Run it *after* DNS
# for the domain points at this server, or the challenge will fail.

# Rate-limit zone for the API. Keeps the site responsive if someone hammers it.
limit_req_zone $binary_remote_addr zone=hds_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hdstradingopc.com www.hdstradingopc.com;

    # Certbot serves its challenge from here before TLS exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hdstradingopc.com$request_uri;
    }
}

# Send www to the bare domain so there is one canonical address for SEO.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hdstradingopc.com;

    ssl_certificate     /etc/letsencrypt/live/hdstradingopc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hdstradingopc.com/privkey.pem;

    return 301 https://hdstradingopc.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hdstradingopc.com;

    ssl_certificate     /etc/letsencrypt/live/hdstradingopc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hdstradingopc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to always use HTTPS for this domain from now on.
    #
    # Deliberately WITHOUT includeSubDomains. This domain has subdomains run by
    # other systems — crm, payroll, accounting, inventory — and the directive
    # would force HTTPS on all of them for a year, from a policy set here. Any
    # of them served over plain HTTP, or with a certificate that does not match,
    # becomes unreachable in the browser with no way for the visitor to bypass
    # it.
    #
    # Add `; includeSubDomains` only once every subdomain is confirmed to serve
    # valid HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product photos and machinery images can be large.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # The payment webhook must never be rate-limited or buffered — PayMongo
    # retries on a slow response, and the signature covers the raw body.
    location = /api/webhooks/paymongo {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /api/ {
        limit_req zone=hds_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Everything else — pages, assets, robots.txt, sitemap.xml — is served by
    # the Node process, which knows which paths are client-side routes.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/hdstradingopc.access.log;
    error_log  /var/log/nginx/hdstradingopc.error.log;
}
