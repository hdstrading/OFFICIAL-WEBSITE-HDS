# Temporary HTTP-only nginx config, used once to obtain the TLS certificate.
#
# The real configs (nginx.conf and nginx-api-only.conf) reference certificate
# files, so nginx will not start until those exist — and certbot cannot create
# them while nginx is failing to start. This config breaks that deadlock: it
# listens on port 80 only, serves the ACME challenge, and proxies everything
# else to the application so the site is reachable meanwhile.
#
# Single-server setup:
#   sudo cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/hdstradingopc
#   sudo ln -s /etc/nginx/sites-available/hdstradingopc /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d hdstradingopc.com -d www.hdstradingopc.com
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hdstradingopc
#   sudo nginx -t && sudo systemctl reload nginx
#
# Split setup (API subdomain): change server_name below to
# api.hdstradingopc.com, request the certificate for that name, then install
# nginx-api-only.conf instead.

server {
    listen 80;
    listen [::]:80;
    server_name hdstradingopc.com www.hdstradingopc.com;

    # certbot writes its challenge file here and Let's Encrypt fetches it over
    # plain HTTP. This location must stay reachable without TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
