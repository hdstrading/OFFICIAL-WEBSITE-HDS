# nginx configuration for the API subdomain, api.hdstradingopc.com.
#
# Use this INSTEAD of nginx.conf when you are running the split setup: the
# website served statically from the IONOS webspace, the API on this VPS.
#
# Install:
#   sudo cp deploy/nginx-api-only.conf /etc/nginx/sites-available/hds-api
#   sudo ln -s /etc/nginx/sites-available/hds-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.hdstradingopc.com

limit_req_zone $binary_remote_addr zone=hds_api_only:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.hdstradingopc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.hdstradingopc.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hdstradingopc.com;

    ssl_certificate     /etc/letsencrypt/live/api.hdstradingopc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hdstradingopc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No includeSubDomains: this is a leaf name, and the directive would also
    # apply to any deeper subdomain of it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/plain;

    # CORS headers come from the application, which checks the origin against
    # CORS_ORIGINS. nginx must not add its own or the browser sees two values
    # for Access-Control-Allow-Origin and rejects the response.

    # The payment webhook must not be rate-limited or buffered — PayMongo
    # retries on a slow response, and the signature covers the raw body.
    location = /api/webhooks/paymongo {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        limit_req zone=hds_api_only burst=40 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/hds-api.access.log;
    error_log  /var/log/nginx/hds-api.error.log;
}
